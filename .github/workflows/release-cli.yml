name: Release CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify release version
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('../package.json').version")"
          if [[ "$release_version" != "$package_version" ]]; then
            echo "Tag version ${release_version} does not match English Punch ${package_version}." >&2
            exit 1
          fi

      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Run tests
        run: go test ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
          workdir: cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GoReleaser logs PR creation failures without failing the release.
      - name: Verify formula pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          formula_branch="release/ep-${GITHUB_REF_NAME#v}"
          pr_url="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$formula_branch" --base main --state open --json url --jq '.[0].url // empty')"
          if [[ -z "$pr_url" ]]; then
            echo "Formula PR missing. Check GoReleaser logs and repository permissions for Actions to create pull requests." >&2
            exit 1
          fi
          echo "Formula PR: $pr_url"
